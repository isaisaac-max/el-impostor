.mega-overlay{position:fixed;inset:0;z-index:20;background:rgba(17,20,45,.97);display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom))}.mega-content{position:relative;z-index:2;max-width:430px;width:100%;text-align:center;margin:auto}.mega-content h2{font-size:2.8rem;line-height:1.08;margin:18px 0}.mega-trophy{font-size:5rem;margin:10px 0 22px}.mega-names{font-size:1.7rem;font-weight:800;color:#d6f76d;margin:20px 0;overflow-wrap:anywhere}.fireworks{position:absolute;inset:0;overflow:hidden;pointer-events:none}.fireworks span{position:absolute;left:var(--x);top:var(--y);width:6px;height:6px;border-radius:50%;background:var(--spark);box-shadow:0 0 14px var(--spark);animation:firework 1.8s ease-out var(--delay) 3 both}@keyframes firework{0%{opacity:0;transform:rotate(var(--angle)) translateX(0) scale(.5)}15%{opacity:1}85%{opacity:.7}100%{opacity:0;transform:rotate(var(--angle)) translateX(var(--radius)) scale(.2)}}@media(prefers-reduced-motion:reduce){.fireworks span{animation:none;opacity:.45;transform:rotate(var(--angle)) translateX(var(--radius))}}
</style></head><body><main class="wrap"><header class="brand"><span class="eyebrow">En la mesa</span><button class="menu-home" id="menu-home">Menú principal</button></header><div id="app" class="screen"></div></main><div id="veil" class="hidden"><div><h2>Tu secreto está oculto</h2><p>Toca para continuar cuando tengas el celular.</p><button class="primary" id="resume">Continuar</button></div></div><script src="app.js"></script></body></html>
